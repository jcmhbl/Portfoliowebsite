<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>À propos, Djamila Chaïbi</title>
<meta name="description" content="Parcours, formation et façon de travailler de Djamila Chaïbi, chargée de projet digital.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="inner">
<header class="top" id="top">
  <a class="brand" href="index.html" data-i18n="name"></a>
  <nav aria-label="Menu principal"><ul id="menu"></ul></nav>
  <div class="tools">
    <button id="lang" class="pill" type="button"></button>
    <button id="burger" class="pill" type="button" aria-label="Menu" aria-expanded="false">Menu</button>
  </div>
</header>

<main>
  <section class="sec intro">
    <h1 data-i18n="about.title"></h1>
    <p class="lead" data-i18n="about.intro"></p>
  </section>

  <section class="sec">
    <h2 data-i18n="about.howTitle"></h2>
    <ul class="how" id="how"></ul>
  </section>

  <section class="sec" id="parcours">
    <h2 data-i18n="about.tlTitle"></h2>
    <p class="hint" data-i18n="about.tlHint"></p>
    <div class="frise" id="frise"></div>
  </section>

  <section class="sec">
    <h2 data-i18n="about.cvTitle"></h2>
    <p data-i18n="about.cvText"></p>
    <p><a class="btn primary" id="cv" data-i18n="about.cvBtn" href="#" download></a></p>
  </section>

  <section class="sec">
    <h2 data-i18n="about.certTitle"></h2>
    <div class="track" id="certs"></div>
  </section>

  <section class="sec">
    <h2 data-i18n="about.consultTitle"></h2>
    <p data-i18n="about.consultText"></p>
  </section>
</main>

<footer class="foot" id="contact">
  <div class="sec">
    <h2 data-i18n="contactTitle"></h2>
    <p data-i18n="contactText"></p>
    <p class="links">
      <a id="mail" href="#"></a>
      <a data-link="linkedin" data-i18n="linkedin" href="#"></a>
      <a data-link="github" data-i18n="github" href="#"></a>
      <a data-link="linktree" data-i18n="linktree" href="#"></a>
    </p>
  </div>
</footer>

<script src="content.js"></script>
<script src="main.js"></script>
</body>
</html>
